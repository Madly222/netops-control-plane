[project]
name = "mcp-server-monitor"
version = "1.0.0"
description = "Self-hosted control plane for monitoring Linux servers, GPON OLTs and NetBox, with Claude integration"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "E722"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
