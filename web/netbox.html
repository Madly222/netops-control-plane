<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetBox Auto-Fill — MCP Monitor</title>
<link rel="stylesheet" href="/css/style.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
.nb-app{color:#e2e8f0;font-family:'JetBrains Mono',monospace;padding:20px;max-width:1300px;margin:0 auto}
.nb-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.nb-topbar-left{display:flex;align-items:center;gap:16px}
.nb-logo{display:flex;align-items:center;gap:10px}
.nb-logo-icon{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.nb-logo-text{font-size:16px;font-weight:700}
.nb-logo-sub{font-size:11px;color:#888}
.nb-back{padding:8px 16px;background:#333;border:none;color:#fff;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.nb-back:hover{background:#444}
.nb-health{display:flex;align-items:center;gap:6px;font-size:12px;color:#888}
.nb-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.nb-dot-ok{background:#4CAF50}.nb-dot-err{background:#f44336}
.nb-card{background:#1a1a2e;border:1px solid #333;border-radius:10px;padding:20px;margin-bottom:20px}
.nb-card-title{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:15px;font-weight:700}
.nb-form-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:end}
.nb-label{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;display:block}
.nb-input{background:#0d1117;border:1px solid #333;border-radius:6px;padding:10px 12px;color:#e2e8f0;font-size:13px;font-family:inherit;outline:none;width:100%;box-sizing:border-box}
.nb-input:focus{border-color:#3b82f6}
.nb-btn{border:none;border-radius:6px;padding:10px 18px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-width:110px;transition:all .2s}
.nb-btn-primary{background:#3b82f6;color:#fff}.nb-btn-primary:hover{background:#2563eb}
.nb-btn-success{background:#4CAF50;color:#fff}.nb-btn-success:hover{background:#43a047}
.nb-btn-outline{background:transparent;border:1px solid #333;color:#e2e8f0}.nb-btn-outline:hover{border-color:#3b82f6}
.nb-btn:disabled{opacity:.5;cursor:not-allowed}
.nb-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600}
.b-trunk{color:#8b5cf6;background:rgba(139,92,246,.12)}.b-access{color:#06b6d4;background:rgba(6,182,212,.12)}
.b-success{color:#4CAF50;background:rgba(76,175,80,.1)}.b-warning{color:#ff9800;background:rgba(255,152,0,.1)}
.b-danger{color:#f44336;background:rgba(244,67,54,.1)}.b-accent{color:#3b82f6;background:rgba(59,130,246,.15)}
.b-dim{color:#888;background:rgba(100,116,139,.1)}
.nb-error{margin-top:12px;padding:10px 14px;background:rgba(244,67,54,.1);border:1px solid #f44336;border-radius:6px;color:#f44336;font-size:13px}
.nb-log{padding:0;overflow:hidden}
.nb-log-head{padding:10px 14px;border-bottom:1px solid #333;font-size:11px;font-weight:700;color:#888;text-transform:uppercase}
.nb-log-body{max-height:220px;overflow-y:auto;padding:6px 14px}
.nb-log-line{font-size:12px;color:#888;padding:3px 0;border-bottom:1px solid #252540}
.nb-device-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.nb-device-label{font-size:11px;font-weight:600;color:#888;text-transform:uppercase}
.nb-device-value{font-size:14px;font-weight:600;margin-top:4px}
.nb-table-head{padding:14px 18px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
.nb-table-head-left{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.nb-table-head-right{display:flex;gap:8px}
table.nb-tbl{width:100%;border-collapse:collapse;font-size:12px}
.nb-tbl th{text-align:left;padding:8px 10px;font-size:10px;font-weight:700;color:#888;text-transform:uppercase;border-bottom:2px solid #333}
.nb-tbl td{padding:10px;border-bottom:1px solid #252540;vertical-align:middle}
.nb-tbl tr.sel{background:rgba(59,130,246,.1)}
.nb-tbl tr:hover{background:rgba(255,255,255,.02)}
.nb-tbl input[type=checkbox]{accent-color:#3b82f6;width:15px;height:15px;cursor:pointer}
.nb-vlan-list{display:flex;flex-wrap:wrap;gap:3px}
.nb-truncate{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-spinner{display:inline-block;width:14px;height:14px;border:2px solid #333;border-top-color:#3b82f6;border-radius:50%;animation:nbspin .8s linear infinite}
@keyframes nbspin{to{transform:rotate(360deg)}}
.nb-hidden{display:none}
.nb-tabs{display:flex;gap:0;border-bottom:1px solid #333;margin-bottom:20px}
.nb-tab{padding:10px 20px;font-size:13px;font-weight:600;color:#888;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.nb-tab:hover{color:#fff}.nb-tab.active{color:#3b82f6;border-bottom-color:#3b82f6}
.nb-batch-input{width:100%;min-height:70px;background:#0d1117;border:1px solid #333;border-radius:6px;padding:10px 12px;color:#e2e8f0;font-size:12px;font-family:inherit;outline:none;resize:vertical}
.nb-batch-input:focus{border-color:#3b82f6}
.nb-progress-bar{width:100%;height:4px;background:#333;border-radius:2px;overflow:hidden;margin-top:10px}
.nb-progress-fill{height:100%;background:#3b82f6;transition:width .3s;border-radius:2px}
@media(max-width:900px){.nb-form-row{grid-template-columns:1fr}.nb-device-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app-container">
<header class="header">
  <div class="header-left"><h1>🖥️ MCP Server Monitor</h1></div>
  <div class="header-right">
    <span class="connection-status" id="connectionStatus"><span class="status-dot status-ok"></span><span id="statusText">Connected</span></span>
    <span class="user-info" id="userInfo"><span id="username"></span><span id="userRole" class="user-role"></span></span>
    <button class="btn btn-logout" id="logoutBtn">Logout</button>
  </div>
</header>
<main class="main-content">
<div class="nb-app">
  <div class="nb-topbar">
    <div class="nb-topbar-left">
      <a href="/" class="nb-back">← Back to Monitor</a>
      <div class="nb-logo">
        <div class="nb-logo-icon">NB</div>
        <div><div class="nb-logo-text">NetBox Auto-Fill</div><div class="nb-logo-sub">Cisco SSH → NetBox Automation</div></div>
      </div>
    </div>
    <button class="nb-btn nb-btn-primary" id="nbSyncMac" onclick="nbSyncMac()" style="margin-right:16px" title="Синхронизация MAC адресов из DHCP в NetBox">🔄 Sync MAC</button><button class="nb-btn nb-btn-primary" id="nbSyncPorts" onclick="nbSyncPorts()" style="margin-right:8px" title="Найти листовой порт каждого MAC и привязать IP к интерфейсу устройства">🔗 Sync Ports</button><input id="nbRadUser" class="nb-input" placeholder="RADIUS login" autocomplete="off" style="width:100px;margin-right:4px" title="RADIUS-аккаунт для входа на свичи. Пробуется первым"><input id="nbRadPass" class="nb-input" type="password" placeholder="RADIUS pass" autocomplete="new-password" style="width:100px;margin-right:8px" title="Пароль RADIUS"><input id="nbSshUser" class="nb-input" placeholder="SSH login" autocomplete="off" style="width:90px;margin-right:4px" title="Локальный SSH-аккаунт. Пробуется вторым. Пусто = из .env"><input id="nbSshPass" class="nb-input" type="password" placeholder="SSH pass" autocomplete="new-password" style="width:90px;margin-right:16px" title="Пароль локального SSH"><div class="nb-health" id="nbHealth">Checking NetBox...</div>
  </div>

  <div class="nb-tabs">
    <button class="nb-tab active" onclick="nbSwitchTab('single')">Single Device</button>
    <button class="nb-tab" onclick="nbSwitchTab('batch')">Batch Mode</button>
  </div>

  <div id="nb-tab-single">
    <div class="nb-card">
      <div class="nb-card-title">⚡ Device Scanner</div>
      <div style="display:flex;gap:12px;margin-bottom:12px">
        <div style="width:120px"><label class="nb-label">Device Type</label>
          <select class="nb-input" id="nbDeviceType" onchange="nbUpdateDeviceType()" style="width:120px">
            <option value="switch">Switch</option>
            <option value="router">Router</option>
          </select>
        </div>
        <div style="width:120px"><label class="nb-label">Connection</label>
          <select class="nb-input" id="nbConnType" onchange="nbUpdateConnFields()" style="width:120px">
            <option value="ssh">SSH</option>
            <option value="radius">RADIUS</option>
          </select>
        </div>
      </div>
      <div class="nb-form-row">
        <div><label class="nb-label" id="nbHostLabel">Switch IP Address</label><input class="nb-input" id="nbHost" placeholder="Enter IP address" onkeydown="if(event.key==='Enter')nbScan()"></div>
        <div><label class="nb-label" id="nbUserLabel">SSH Username</label><input class="nb-input" id="nbUser" placeholder=""></div>
        <div><label class="nb-label" id="nbPassLabel">SSH Password</label><input class="nb-input" id="nbPass" type="password" placeholder=""></div>
        <button class="nb-btn nb-btn-primary" id="nbBtnScan" onclick="nbScan()">🔍 Scan</button>
      </div>
      <div id="nbError" class="nb-error nb-hidden"></div>
    </div>
    <div id="nbScanLog" class="nb-hidden"></div>
    <div id="nbDeviceInfo" class="nb-hidden"></div>
    <div id="nbPortTable" class="nb-hidden"></div>
    <div id="nbApplyLog" class="nb-hidden"></div>
    <div id="nbRouterInfo" class="nb-hidden"></div>
  </div>

  <div id="nb-tab-batch" class="nb-hidden">
    <div class="nb-card">
      <div class="nb-card-title">🚀 Batch Auto-Fill</div>
      <div><label class="nb-label">IP Addresses (one per line)</label><textarea class="nb-batch-input" id="nbBatchIps" placeholder="198.51.100.13&#10;198.51.100.14&#10;198.51.100.15"></textarea></div>
      <div style="display:flex;gap:12px;align-items:end;margin-top:12px">
        <div><label class="nb-label">SSH Username</label><input class="nb-input" id="nbBatchUser" placeholder=""></div>
        <div><label class="nb-label">SSH Password</label><input class="nb-input" id="nbBatchPass" type="password" placeholder=""></div>
        <button class="nb-btn nb-btn-success" id="nbBtnBatch" onclick="nbBatch()">🚀 Run All</button>
      </div>
      <div id="nbBatchProgress" class="nb-hidden"><div class="nb-progress-bar"><div class="nb-progress-fill" id="nbBatchFill"></div></div></div>
    </div>
    <div id="nbBatchResults"></div>
  </div>
</div>
</main>
<footer class="footer"><p>MCP Server Monitor v1.0.0 — NetBox Auto-Fill</p></footer>
</div>

<script src="/js/api.js"></script>
<script>
function nbUpdateDeviceType() {
  const deviceType = document.getElementById("nbDeviceType").value;
  const hostLabel = document.getElementById("nbHostLabel");
  if (deviceType === "router") {
    hostLabel.textContent = "Router IP Address";
  } else {
    hostLabel.textContent = "Switch IP Address";
  }
}

function nbUpdateConnFields() {
  const connType = document.getElementById("nbConnType").value;
  const userLabel = document.getElementById("nbUserLabel");
  const passLabel = document.getElementById("nbPassLabel");
  if (connType === "radius") {
    userLabel.textContent = "RADIUS Username";
    passLabel.textContent = "RADIUS Password";
  } else {
    userLabel.textContent = "SSH Username";
    passLabel.textContent = "SSH Password";
  }
}
const NB_API='/api/netbox';
let nbScanData=null,nbSelected=new Set();

// Auth check (cookie-based)
(async function(){
  try{
    const r=await fetch('/api/auth/check');
    const d=await r.json();
    if(!d.authenticated){window.location.href='/login.html';return}
    document.getElementById('username').textContent=d.username||'';
    document.getElementById('userRole').textContent=d.role||'';
  }catch(e){window.location.href='/login.html'}
  document.getElementById('logoutBtn').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});window.location.href='/login.html'};
})();

function authHeaders(){return{'Content-Type':'application/json'}}

// Health
fetch(NB_API+'/health',{headers:authHeaders()}).then(r=>r.json()).then(d=>{
  const h=document.getElementById('nbHealth');
  h.innerHTML=d.netbox?.connected?'<span class="nb-dot nb-dot-ok"></span> NetBox v'+(d.netbox.version||'?'):'<span class="nb-dot nb-dot-err"></span> NetBox offline';
}).catch(()=>{document.getElementById('nbHealth').innerHTML='<span class="nb-dot nb-dot-err"></span> API error'});

function nbSwitchTab(t){
  document.querySelectorAll('.nb-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('nb-tab-single').classList.add('nb-hidden');
  document.getElementById('nb-tab-batch').classList.add('nb-hidden');
  if(t==='single'){document.querySelectorAll('.nb-tab')[0].classList.add('active');document.getElementById('nb-tab-single').classList.remove('nb-hidden')}
  else{document.querySelectorAll('.nb-tab')[1].classList.add('active');document.getElementById('nb-tab-batch').classList.remove('nb-hidden')}
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function nbRenderLogs(logs,id,title){
  const el=document.getElementById(id);el.className='nb-card nb-log';el.classList.remove('nb-hidden');
  el.innerHTML='<div class="nb-log-head">'+title+'</div><div class="nb-log-body">'+logs.map(l=>'<div class="nb-log-line">'+esc(l)+'</div>').join('')+'</div>';
  el.querySelector('.nb-log-body').scrollTop=99999;
}

async function nbScan(){
  const host=document.getElementById('nbHost').value.trim();if(!host)return;
  const deviceType=document.getElementById('nbDeviceType').value;
  document.getElementById('nbError').classList.add('nb-hidden');
  const btn=document.getElementById('nbBtnScan');btn.disabled=true;btn.innerHTML='<span class="nb-spinner"></span> Scanning...';
  ['nbDeviceInfo','nbPortTable','nbApplyLog','nbRouterInfo'].forEach(i=>{const el=document.getElementById(i);if(el)el.classList.add('nb-hidden')});
  try{
    const body={host, connection_type: document.getElementById('nbConnType').value, device_type: deviceType};
    const u=document.getElementById('nbUser').value.trim(),p=document.getElementById('nbPass').value;
    if(u)body.username=u;if(p)body.password=p;
    const endpoint = deviceType === 'router' ? '/scan-router' : '/scan';
    const res=await fetch(NB_API+endpoint,{method:'POST',headers:authHeaders(),body:JSON.stringify(body)});
    const data=await res.json();if(!res.ok)throw new Error(data.detail||'Scan failed');
    nbScanData=data;
    nbRenderLogs(data.logs||[],'nbScanLog','Scan Log');
    if(deviceType === 'router') {
      nbRenderRouter(data);
    } else {
      const di=document.getElementById('nbDeviceInfo');di.classList.remove('nb-hidden');di.className='nb-card';
      di.innerHTML='<div class="nb-device-grid">'+[['Host',data.host],['Hostname',data.hostname||'—'],['NetBox Device',data.device_name||'Not found'],['Ports Found',data.ports?.length||0]].map(([l,v])=>'<div><div class="nb-device-label">'+l+'</div><div class="nb-device-value">'+esc(String(v))+'</div></div>').join('')+'</div>';
      nbSelected=new Set((data.ports||[]).map(p=>p.port_name));nbRenderPorts();
    }
  }catch(e){const el=document.getElementById('nbError');el.textContent=e.message;el.classList.remove('nb-hidden')}
  finally{btn.disabled=false;btn.innerHTML='🔍 Scan'}
}

let nbRouterSelected=new Set();
function nbRenderRouter(data){
  const el=document.getElementById("nbRouterInfo");el.classList.remove("nb-hidden");el.className="nb-card";
  let h="<div class=\"nb-device-grid\">";
  h+=[["Host",data.host],["Hostname",data.hostname||"—"],["Model",data.model||"—"],["Serial",data.serial||"—"],["IOS Version",data.ios_version||"—"],["Uptime",data.uptime||"—"]].map(([l,v])=>"<div><div class=\"nb-device-label\">"+l+"</div><div class=\"nb-device-value\">"+esc(String(v))+"</div></div>").join("");
  h+="</div>";
  // Interfaces table with checkboxes
  if(data.interfaces?.length){
    nbRouterSelected=new Set(data.interfaces.filter(i=>i.status==="up").map(i=>i.name));
    const allSel=nbRouterSelected.size===data.interfaces.length;
    h+="<div style=\"margin-top:16px;display:flex;justify-content:space-between;align-items:center\"><strong>Interfaces ("+data.interfaces.length+")</strong>";
    h+="<div><button class=\"nb-btn nb-btn-outline\" style=\"padding:5px 12px;font-size:11px\" onclick=\"nbToggleAllRouter()\">"+( allSel?"Deselect All":"Select All")+"</button>";
    h+="<button class=\"nb-btn nb-btn-success\" style=\"padding:5px 12px;font-size:11px;margin-left:8px\" id=\"nbBtnApplyRouter\" onclick=\"nbApplyRouter()\">✅ Apply to NetBox</button></div></div>";
    h+="<div style=\"overflow-x:auto\"><table class=\"nb-tbl\"><thead><tr><th style=\"width:36px\"><input type=\"checkbox\" "+(allSel?"checked":"")+" onchange=\"nbToggleAllRouter()\"></th><th>Interface</th><th>IP Address</th><th>Status</th><th>Protocol</th><th>Description</th></tr></thead><tbody>";
    for(const i of data.interfaces){
      const sel=nbRouterSelected.has(i.name);
      const stC=i.status==="up"?"#4ade80":"#f87171";
      const prC=i.protocol==="up"?"#4ade80":"#f87171";
      h+="<tr><td><input type=\"checkbox\" "+(sel?"checked":"")+" onchange=\"nbToggleRouter(\'"+i.name+"\')\"></td><td>"+esc(i.name)+"</td><td>"+esc(i.ip_address)+"</td><td style=\"color:"+stC+"\">"+esc(i.status)+"</td><td style=\"color:"+prC+"\">"+esc(i.protocol)+"</td><td>"+esc(i.description||"—")+"</td></tr>";
    }
    h+="</tbody></table></div>";
  }
  // Connected routes
  if(data.routes?.length){
    h+="<div style=\"margin-top:16px\"><strong>Connected Routes ("+data.routes.length+")</strong></div>";
    h+="<div style=\"overflow-x:auto\"><table class=\"nb-tbl\"><thead><tr><th>Network</th><th>Interface</th></tr></thead><tbody>";
    for(const r of data.routes){
      h+="<tr><td>"+esc(r.network)+"</td><td>"+esc(r.interface)+"</td></tr>";
    }
    h+="</tbody></table></div>";
  }
  // CDP Neighbors
  if(data.cdp_neighbors?.length){
    h+="<div style=\"margin-top:16px\"><strong>CDP Neighbors ("+data.cdp_neighbors.length+")</strong></div>";
    h+="<div style=\"overflow-x:auto\"><table class=\"nb-tbl\"><thead><tr><th>Local Port</th><th>Remote Device</th><th>Remote Port</th><th>Platform</th></tr></thead><tbody>";
    for(const n of data.cdp_neighbors){
      h+="<tr><td>"+esc(n.local_port)+"</td><td>"+esc(n.remote_device)+"</td><td>"+esc(n.remote_port)+"</td><td>"+esc(n.platform||"—")+"</td></tr>";
    }
    h+="</tbody></table></div>";
  }
  el.innerHTML=h;
}
function nbToggleRouter(name){
  if(nbRouterSelected.has(name))nbRouterSelected.delete(name);else nbRouterSelected.add(name);
  nbRenderRouter(nbScanData);
}
function nbToggleAllRouter(){
  if(nbRouterSelected.size===nbScanData.interfaces.length)nbRouterSelected.clear();
  else nbRouterSelected=new Set(nbScanData.interfaces.map(i=>i.name));
  nbRenderRouter(nbScanData);
}
async function nbSyncMac(){
  const btn=document.getElementById("nbSyncMac");
  btn.disabled=true;btn.innerHTML="<span class=\"nb-spinner\"></span> Syncing...";
  try{
    const res=await fetch(NB_API+"/sync-mac",{method:"POST",headers:authHeaders(),credentials:"include"});
    const data=await res.json();
    if(data.success){
      const s=data.stats||{};
      alert("✅ MAC Sync Complete\n\nUpdated: "+s.updated+"\nSkipped: "+s.skipped+"\nNot found: "+s.not_found+"\nErrors: "+s.errors);
    }else{
      alert("❌ Error: "+(data.error||"Unknown error"));
    }
    if(data.logs?.length){
      nbRenderLogs(data.logs,"nbScanLog","MAC Sync Log");
      document.getElementById("nbScanLog").classList.remove("nb-hidden");
    }
  }catch(e){alert("❌ Error: "+e.message)}
  finally{btn.disabled=false;btn.innerHTML="🔄 Sync MAC"}
}
async function nbSyncPorts(){
  const btn=document.getElementById("nbSyncPorts");
  btn.disabled=true;btn.innerHTML="<span class=\"nb-spinner\"></span> Tracing...";
  try{
    const body={
      radius_username:(document.getElementById("nbRadUser")||{}).value||"",
      radius_password:(document.getElementById("nbRadPass")||{}).value||"",
      ssh_username:(document.getElementById("nbSshUser")||{}).value||"",
      ssh_password:(document.getElementById("nbSshPass")||{}).value||""
    };
    const res=await fetch(NB_API+"/sync-interfaces",{method:"POST",headers:{...authHeaders(),"Content-Type":"application/json"},credentials:"include",body:JSON.stringify(body)});
    const data=await res.json();
    if(data.success){
      const s=data.stats||{};
      const fails=(data.failures||[]).length;
      alert("✅ Port Sync Complete\n\nAssigned: "+s.assigned+"\nAlready OK: "+s.already_ok+"\nNo leaf found: "+s.no_leaf+"\n   • unseen (MAC nowhere): "+(s.no_leaf_unseen||0)+"\n   • trunk (only busy ports): "+(s.no_leaf_trunk||0)+"\nInterface missing: "+s.iface_missing+"\nDevice missing: "+s.dev_missing+"\nErrors: "+s.errors+"\n\nDevices scanned: "+s.devices_scanned+" (failed: "+s.devices_failed+", skipped: "+(s.devices_skipped||0)+")"+(fails?"\n\n⚠ "+fails+" device(s) unreachable — see log below":""));
    }else{
      alert("❌ Error: "+(data.error||"Unknown error"));
    }
    if(data.logs?.length){
      nbRenderLogs(data.logs,"nbScanLog","Port Sync Log");
      document.getElementById("nbScanLog").classList.remove("nb-hidden");
    }
  }catch(e){alert("❌ Error: "+e.message)}
  finally{btn.disabled=false;btn.innerHTML="🔗 Sync Ports"}
}

async function nbApplyRouter(){
  const btn=document.getElementById("nbBtnApplyRouter");btn.disabled=true;btn.innerHTML="<span class=\"nb-spinner\"></span> Applying...";
  try{
    const res=await fetch(NB_API+"/apply-router",{method:"POST",headers:authHeaders(),body:JSON.stringify({host:nbScanData.host,selected_ports:[...nbRouterSelected]})});
    const data=await res.json();
    nbRenderLogs(data.logs||[],"nbApplyLog","Apply Log");
    document.getElementById("nbApplyLog").classList.remove("nb-hidden");
  }catch(e){alert("Error: "+e.message)}
  finally{btn.disabled=false;btn.innerHTML="✅ Apply to NetBox"}
}

function nbRenderPorts(){
  if(!nbScanData?.ports?.length)return;
  const el=document.getElementById('nbPortTable');el.classList.remove('nb-hidden');el.className='nb-card';el.style.padding='0';
  const allSel=nbSelected.size===nbScanData.ports.length;
  let h='<div class="nb-table-head"><div class="nb-table-head-left"><span>Port Configuration</span><span class="nb-badge b-accent">'+nbSelected.size+'/'+nbScanData.ports.length+' selected</span></div><div class="nb-table-head-right"><button class="nb-btn nb-btn-outline" style="padding:5px 12px;font-size:11px" onclick="nbToggleAll()">'+(allSel?'Deselect All':'Select All')+'</button><button class="nb-btn nb-btn-success" style="padding:5px 12px;font-size:11px" id="nbBtnApply" onclick="nbApply()" '+(nbSelected.size===0?'disabled':'')+'>✅ Apply ('+nbSelected.size+')</button></div></div>';
  h+='<div style="overflow-x:auto"><table class="nb-tbl"><thead><tr><th style="width:36px"><input type="checkbox" '+(allSel?'checked':'')+' onchange="nbToggleAll()"></th><th>Port</th><th>Mode</th><th>VLANs</th><th>Description</th><th>CDP Neighbor</th><th>Remote Port</th><th>Cable</th><th>NB</th></tr></thead><tbody>';
  for(const p of nbScanData.ports){
    const sel=nbSelected.has(p.port_name),mode=p.mode||'—',mc=mode==='trunk'?'b-trunk':mode==='access'?'b-access':'b-dim';
    let vl='<span style="color:#555">—</span>';
    if(mode==='trunk'&&p.trunk_vlans?.length){const s=p.trunk_vlans.length>5?[...p.trunk_vlans.slice(0,5),'+'+(p.trunk_vlans.length-5)]:p.trunk_vlans;vl='<div class="nb-vlan-list">'+s.map(v=>'<span class="nb-badge b-trunk">'+v+'</span>').join('')+'</div>'}
    else if(mode==='access')vl='<span class="nb-badge b-access">'+(p.access_vlan||'—')+'</span>';
    const cab=p.cable_exists?'<span class="nb-badge b-success">linked</span>':p.cdp_neighbor?'<span class="nb-badge b-warning">new</span>':'—';
    const nb=p.netbox_interface_id?'<span class="nb-badge b-success">✓</span>':'<span class="nb-badge b-danger">✗</span>';
    h+='<tr class="'+(sel?'sel':'')+'" onclick="nbToggle(\''+p.port_name+'\')"><td><input type="checkbox" '+(sel?'checked':'')+' onclick="event.stopPropagation();nbToggle(\''+p.port_name+'\')"></td><td style="font-weight:600">'+esc(p.port_name)+'</td><td><span class="nb-badge '+mc+'">'+mode+'</span></td><td>'+vl+'</td><td class="nb-truncate" style="color:'+(p.description?'#e2e8f0':'#555')+'">'+esc(p.description||'—')+'</td><td style="font-weight:'+(p.cdp_neighbor?'600':'400')+';color:'+(p.cdp_neighbor?'#e2e8f0':'#555')+'">'+esc(p.cdp_neighbor||'—')+'</td><td>'+esc(p.cdp_remote_port||'—')+'</td><td>'+cab+'</td><td>'+nb+'</td></tr>';
  }
  h+='</tbody></table></div>';el.innerHTML=h;
}

function nbToggle(n){nbSelected.has(n)?nbSelected.delete(n):nbSelected.add(n);nbRenderPorts()}
function nbToggleAll(){if(!nbScanData)return;nbSelected.size===nbScanData.ports.length?nbSelected=new Set():nbSelected=new Set(nbScanData.ports.map(p=>p.port_name));nbRenderPorts()}

async function nbApply(){
  if(!nbScanData||nbSelected.size===0)return;
  const btn=document.getElementById('nbBtnApply');btn.disabled=true;btn.innerHTML='<span class="nb-spinner"></span> Applying...';
  try{
    const res=await fetch(NB_API+'/apply',{method:'POST',headers:authHeaders(),body:JSON.stringify({host:nbScanData.host,selected_ports:[...nbSelected]})});
    const data=await res.json();nbRenderLogs(data.logs||[],'nbApplyLog','Apply Log');
  }catch(e){nbRenderLogs(['❌ Error: '+e.message],'nbApplyLog','Apply Log')}
  finally{btn.disabled=false;btn.innerHTML='✅ Apply ('+nbSelected.size+')'}
}

async function nbBatch(){
  const ips=document.getElementById('nbBatchIps').value.trim().split('\n').map(s=>s.trim()).filter(Boolean);if(!ips.length)return;
  const btn=document.getElementById('nbBtnBatch');btn.disabled=true;btn.innerHTML='<span class="nb-spinner"></span> Running...';
  const prog=document.getElementById('nbBatchProgress');prog.classList.remove('nb-hidden');
  const fill=document.getElementById('nbBatchFill'),results=document.getElementById('nbBatchResults');results.innerHTML='';
  const u=document.getElementById('nbBatchUser').value.trim(),p=document.getElementById('nbBatchPass').value;
  for(let i=0;i<ips.length;i++){
    fill.style.width=((i/ips.length)*100)+'%';
    const card=document.createElement('div');card.className='nb-card';
    card.innerHTML='<div class="nb-card-title"><span class="nb-spinner"></span> '+esc(ips[i])+' — processing...</div>';results.appendChild(card);
    try{
      const body={host:ips[i]};if(u)body.username=u;if(p)body.password=p;
      const res=await fetch(NB_API+'/auto',{method:'POST',headers:authHeaders(),body:JSON.stringify(body)});
      const data=await res.json();
      const st=data.errors?.length?'⚠️':'✅',logs=[...(data.scan_logs||[]),...(data.apply_logs||[])];
      card.innerHTML='<div class="nb-card-title">'+st+' '+esc(ips[i])+' — '+esc(data.hostname||'unknown')+'</div><div style="display:flex;gap:12px;margin-bottom:10px"><span class="nb-badge b-success">'+data.ports_updated+' ports</span><span class="nb-badge b-accent">'+data.cables_created+' cables</span>'+(data.errors?.length?'<span class="nb-badge b-danger">'+data.errors.length+' errors</span>':'')+'</div><div class="nb-log-body" style="max-height:140px;overflow-y:auto">'+logs.map(l=>'<div class="nb-log-line">'+esc(l)+'</div>').join('')+'</div>';
    }catch(e){card.innerHTML='<div class="nb-card-title">❌ '+esc(ips[i])+'</div><div class="nb-error">'+esc(e.message)+'</div>'}
  }
  fill.style.width='100%';btn.disabled=false;btn.innerHTML='🚀 Run All';
}
</script>
</body>
