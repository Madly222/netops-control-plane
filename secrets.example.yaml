# ==============================================================================
# SECRETS CONFIGURATION TEMPLATE
# ==============================================================================
# Copy this file to secrets.yaml and fill in your actual values:
#   cp secrets.example.yaml secrets.yaml
#
# WARNING: Never commit secrets.yaml to version control!
# ==============================================================================


# ==============================================================================
# SERVERS
# ==============================================================================
# Fields:
#   id            - Unique identifier (used in logs and UI)
#   host          - IP address or hostname
#   port          - SSH port (default: 22)
#   user          - SSH username
#   auth_type     - "key" or "password"
#   auth_value    - For "key": filename in keys/ folder. For "password": the password
#   sudo_password - Password for sudo (optional). If omitted with password auth,
#                   auth_value is reused; with key auth, NOPASSWD sudo is assumed.
#   distro        - debian, ubuntu, centos, rhel, ... (enables the updates feature)
#   services      - List of service types on this host
#   enabled       - Whether to monitor this host (true/false)
#
# Service types: dhcp, dns, radius (full handlers); postfix, dovecot,
#                spamfilter, apache (generic restart/status only)
# ==============================================================================

servers:
  # DHCP — SSH key + separate sudo password
  - id: dhcp-primary
    host: 192.168.1.1
    port: 22
    user: admin
    auth_type: key
    auth_value: dhcp-primary.key
    sudo_password: "your-sudo-password-here"
    distro: debian
    services: [dhcp]
    enabled: true

  # DNS — key auth, passwordless sudo (NOPASSWD in sudoers)
  - id: dns-primary
    host: 192.168.1.10
    port: 22
    user: admin
    auth_type: key
    auth_value: dns-primary.key
    distro: debian
    services: [dns]
    enabled: false

  # RADIUS — password auth (sudo reuses same password)
  - id: radius
    host: 192.168.1.20
    port: 22
    user: admin
    auth_type: password
    auth_value: "ssh-and-sudo-password"
    distro: debian
    services: [radius]
    enabled: false

  # Mail server with multiple (generic) services
  - id: mail-primary
    host: mail.example.com
    port: 22
    user: admin
    auth_type: key
    auth_value: mail-primary.key
    sudo_password: "sudo-password"
    distro: ubuntu
    services: [postfix, dovecot, spamfilter]
    enabled: false


# ==============================================================================
# MCP SERVER SETTINGS
# ==============================================================================

mcp_server:
  web_host: "0.0.0.0"
  web_port: 4455
  session_secret: "CHANGE-THIS-TO-RANDOM-STRING-MIN-32-CHARACTERS"
  session_expire_hours: 24


# ==============================================================================
# CLAUDE API
# ==============================================================================

claude:
  api_key: "sk-ant-api03-YOUR-API-KEY-HERE"
  model: "claude-sonnet-4-20250514"
  max_tokens: 1024
  timeout_seconds: 30


# ==============================================================================
# EMAIL NOTIFICATIONS (built-in alerts; automation channels use .env)
# ==============================================================================

email:
  enabled: false
  smtp_host: smtp.example.com
  smtp_port: 587
  smtp_user: alerts@example.com
  smtp_password: "your-email-password"
  smtp_tls: true
  from_address: "MCP Monitor <alerts@example.com>"
  to_addresses:
    - admin@example.com


# ==============================================================================
# WEB UI USERS
# ==============================================================================
# On first run, plaintext passwords are automatically hashed (bcrypt).
# Roles: admin (full access) | operator (read-only)
# ==============================================================================

web_users:
  - username: admin
    password: "CHANGE-THIS-PASSWORD"
    role: admin

  - username: operator
    password: "CHANGE-THIS-PASSWORD"
    role: operator


# ==============================================================================
# ONU MONITORING (GPON ONU via SNMP)
# ==============================================================================
# poll_interval     - Seconds between polls
# thresholds.good   - Signal (dBm) at/above which an ONU is "good"
# thresholds.warning- Signal (dBm) below which an ONU is "critical"
#
# OLT fields:
#   id, host, port (SNMP, default 161), community (v2c), version ("2c"|"3"),
#   vendor ("zte"|"huawei"), enabled
#   ssh_username/ssh_password/ssh_port - SSH used to retrieve ONU MAC addresses
#   SNMPv3 only: username, auth_proto, auth_pass, priv_proto, priv_pass
# ==============================================================================

onu_monitoring:
  poll_interval: 60
  thresholds:
    good: -20.0
    warning: -25.0
  olts:
    # Example: SNMP v2c
    - id: olt-1
      host: 192.168.1.50
      port: 161
      community: public
      version: "2c"
      vendor: zte
      enabled: false
      ssh_username: admin
      ssh_password: "olt-ssh-password"
      ssh_port: 22

    # Example: SNMP v3
    - id: olt-2
      host: 192.168.1.51
      port: 161
      version: "3"
      vendor: zte
      enabled: false
      username: snmpv3user
      auth_proto: SHA
      auth_pass: "auth-password"
      priv_proto: AES
      priv_pass: "priv-password"
      ssh_username: admin
      ssh_password: "olt-ssh-password"
      ssh_port: 22
