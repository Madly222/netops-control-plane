# ==============================================================================
# Demo configuration (DEMO_MODE=1)
# ==============================================================================
# Every server and OLT below is simulated by src/demo/: nothing is contacted.
# Addresses come from the documentation ranges (RFC 5737). The passwords are
# public on purpose; never reuse this file for a real deployment.
#
# Logins (all with password "demo-password"):
#   admin    - superadmin: everything, including the admin console
#   ops      - admin: run commands, confirm risky ones, apply fixes
#   viewer   - operator: read-only
#
# Set ANTHROPIC_API_KEY to let Claude interpret free-form requests and
# diagnose unknown errors; without it the keyword fallback is used.
# ==============================================================================

servers:
  - id: dhcp-01
    host: 192.0.2.10
    user: monitor
    auth_type: password
    auth_value: demo
    distro: debian
    services: [dhcp]

  - id: dns-01
    host: 192.0.2.11
    user: monitor
    auth_type: password
    auth_value: demo
    distro: debian
    services: [dns]

  - id: radius-01
    host: 192.0.2.12
    user: monitor
    auth_type: password
    auth_value: demo
    distro: centos
    services: [radius]

  # Simulated as unreachable, to show how a down host looks
  - id: dns-02
    host: 198.51.100.53
    user: monitor
    auth_type: password
    auth_value: demo
    distro: debian
    services: [dns]

mcp_server:
  web_host: "0.0.0.0"
  web_port: 4455
  session_expire_hours: 24

claude:
  api_key: ""
  effort: "low"

web_users:
  - username: admin
    password: "demo-password"
    role: superadmin
  - username: ops
    password: "demo-password"
    role: admin
  - username: viewer
    password: "demo-password"
    role: operator

onu_monitoring:
  poll_interval: 60
  thresholds:
    good: -20.0
    warning: -25.0
  olts:
    - id: olt-01
      host: 192.0.2.100
      community: public
      version: "2c"
      vendor: zte
    - id: olt-02
      host: 192.0.2.101
      community: public
      version: "2c"
      vendor: zte
