version: 2
updates:
  - package-ecosystem: pip
    # The scan from / also finds mcp_server/requirements.txt; listing
    # /mcp_server as well opened a second PR for every mcp update
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 1.8 and later need Python 3.11; lift this when CI stops testing 3.10
      - dependency-name: starlette
        versions: [">=1.8"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
