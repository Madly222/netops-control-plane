# ==============================================================================
#  requirements.lock — ТОЧНЫЙ слепок рабочего venv со старой VM (Python 3.10.12)
# ==============================================================================
# Назначение: воспроизвести на новой машине ровно то, что сейчас работает.
#   ./venv/bin/pip install -r requirements.lock
#
# requirements.txt (декларативный, с диапазоном намерений) РАЗОШЁЛСЯ с прод-venv
# по 10 пакетам — в т.ч. paramiko 3.4.0 против 4.0.0. Ставить с requirements.txt
# при переезде значит развернуть не то приложение, которое работает.
# Сначала поднять стенд с этого lock, потом отдельной задачей примирить txt.
#
# Файл намеренно НЕ отредактирован: это дословный `pip freeze`. Пакеты ниже
# после удаления биллинга уже не нужны и могут быть выпилены ПОСЛЕ того,
# как стенд заработает и будет с чем сравнивать:
#     openpyxl, et_xmlfile, fpdf2, fonttools, scp
# Кандидаты на выпил, не связанные с биллингом (не импортируются нигде):
#     pandas, numpy, pysnmp-lextudio, pysmi-lextudio, pysnmpcrypto
#     (SNMP работает через subprocess snmpwalk, питоновский стек SNMP не нужен)
# ==============================================================================

